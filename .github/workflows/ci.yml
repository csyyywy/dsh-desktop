# CI：类型检查 + 单元测试（不打包——pack:win 需要下载 node/pnpm/dsh，放手动触发）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 跳过 electron 二进制下载（typecheck/test 只需其类型与 JS 入口）
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
