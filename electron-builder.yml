appId: com.dsh.desktop
productName: DeepSeek Harness
copyright: MIT
directories:
  output: dist
  buildResources: resources

files:
  - out/**

extraResources:
  - from: resources
    to: .
    filter:
      - "node/**/*"
      - "node-linux.tar.xz"
      - "icons/**/*"
      - "pnpm/**/*"
      - "dsh-bundle/**/*"

asar: true
# 语言包只保留中文/英文（全量 55 个 .pak 约 47MB，裁剪后约 2MB）
electronLanguages:
  - zh-CN
  - en-US
# 压缩率拉满：NSIS/便携产物更小，构建耗时略增
compression: maximum
# 打包后钩子：删除本应用用不到的 Electron 组件（见 scripts/after-pack.cjs）
afterPack: scripts/after-pack.cjs

win:
  icon: resources/icons/icon.png
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
  # 连字符命名：与 latest.yml 的 url 一致，免去「上传前手工改名」环节（空格名会被 GitHub 转成点号）
  artifactName: DeepSeek-Harness-${version}-setup.${ext}

portable:
  artifactName: DeepSeek-Harness-${version}-portable.${ext}

# 应用自更新走 GitHub Releases：构建时生成 latest.yml / app-update.yml（升级信息），
# 发布时把 latest.yml 一并传上 Release；应用内更新面板直接调 GitHub API + curl 下载安装包。
# 注意：不传 --publish 时不会真的上传，仅本地生成升级信息文件。
publish:
  provider: github
  owner: csyyywy
  repo: dsh-desktop
