appId: com.dsh.desktop
productName: DeepSeek Harness
copyright: MIT
directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - resources/icons/**

extraResources:
  - from: resources
    to: .
    filter:
      - "node/**/*"
      - "node-linux.tar.xz"
      - "icons/**/*"
      - "pnpm/**/*"
      - "dsh-bundle/**/*"

asar: true

win:
  icon: resources/icons/icon.png
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# 应用自更新走 GitHub Releases：构建时生成 latest.yml / app-update.yml（升级信息），
# 发布时把 latest.yml 一并传上 Release；应用内更新面板直接调 GitHub API + curl 下载安装包。
# 注意：不传 --publish 时不会真的上传，仅本地生成升级信息文件。
publish:
  provider: github
  owner: csyyywy
  repo: dsh-desktop
